name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential jq shellcheck
          curl -fsSL https://github.com/twpayne/chezmoi/releases/download/v2.70.3/chezmoi_2.70.3_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin chezmoi
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz \
            | sudo tar -xz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Match the Brewfile's tmux; Ubuntu's apt tmux rejects options the config uses.
      - name: Install tmux from Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install tmux
          sudo ln -sf "$(brew --prefix)/bin/tmux" /usr/local/bin/tmux
          tmux -V

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint:shell
      - run: npm run check
